<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>PotionRH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#a9dbff;font-family:"Press Start 2P",monospace;-webkit-text-size-adjust:100%}
#sky{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;cursor:grab;outline:none}
#c.drag{cursor:grabbing}
.hud{position:fixed;z-index:3;user-select:none;-webkit-user-select:none}
#brand{top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;background:rgba(255,246,250,.82);border:3px solid #f3a6c8;box-shadow:0 0 0 3px #fff,6px 6px 0 rgba(20,90,110,.25);padding:8px 12px}
#brand img{width:26px;height:auto;animation:bob 2.6s ease-in-out infinite}
#brand b{font-size:13px;color:#ec4f86;text-shadow:2px 2px 0 #fbd2e4;letter-spacing:1px}
#brand span{font-size:7px;color:#b05a8a;display:block;margin-top:5px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
#zoom{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
#zoom button{width:46px;height:46px;font:inherit;font-size:14px;cursor:pointer;color:#fff;background:#ffbe78;border:3px solid #c06a4a;box-shadow:inset 3px 3px 0 #ffe4b8,inset -3px -3px 0 #e89060,0 4px 0 #c06a4a;text-shadow:2px 2px 0 #c06a4a;transition:transform .08s,background-color .12s;touch-action:manipulation}
#zoom button:hover{background:#ffd49a}
#zoom button:active{transform:translateY(3px)}
#zoom #zFit{font-size:8px;background:#ec4f86;border-color:#a8325d;box-shadow:inset 2px 2px 0 #ffb3cc,0 4px 0 #a8325d;text-shadow:2px 2px 0 #a8325d}
#zoom #zSite{background:#fff6fa;border-color:#f3a6c8;box-shadow:0 4px 0 #f3a6c8;padding:0}
#zoom #zSite img{width:22px;height:auto;display:block;margin:auto}
#stats{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));background:rgba(255,246,250,.85);border:3px solid #f3a6c8;box-shadow:0 0 0 3px #fff,6px 6px 0 rgba(20,90,110,.25);padding:8px 12px;min-width:120px}
#stats .row{display:flex;align-items:center;gap:8px;font-size:11px;color:#ec4f86}
#stats .bar{height:8px;margin:7px 0;background:#ffe4ee;border:2px solid #f3a6c8}
#stats .bar i{display:block;height:100%;width:50%;background:#ec4f86;transition:width .3s}
#stats .row img{width:16px;height:auto}
#stats .row:last-child b{color:#c06a4a}
#stats .coin{width:14px;height:14px;background:#ffd34d;border:2px solid #c06a4a;box-shadow:inset 2px 2px 0 #ffe27a;box-sizing:border-box}
#hint{left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:8px;line-height:1.9;color:#7a3e78;background:rgba(255,246,250,.72);border:3px solid #f3a6c8;padding:8px 10px;transition:opacity .6s}
#hint.off{opacity:0;pointer-events:none}
#load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#3fcde6;color:#fff;font-size:12px;text-shadow:2px 2px 0 #148cb4;transition:opacity .5s}
#load.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="sky" width="256" height="240"></canvas>
<canvas id="c" tabindex="0" data-testid="game-canvas"></canvas>
<div id="brand" class="hud" data-testid="game-brand"><img src="/assets/potion.png" alt=""/><div><b>POTIONRH</b><span>PINK DREAM ISLAND</span></div></div>
<div id="hint" class="hud" data-testid="game-hint">SCROLL: ZOOM<br/>DRAG: MOVE</div>
<div id="stats" class="hud" data-testid="game-stats">
  <div class="row"><img src="/assets/potion.png" alt=""/><b id="potionCount" data-testid="potion-count">0</b></div>
  <div class="bar"><i id="tankFill" data-testid="tank-fill"></i></div>
  <div class="row"><span class="coin"></span><b id="goldCount" data-testid="gold-count">0</b></div>
</div>
<div id="zoom" class="hud">
  <button id="zIn" type="button" data-testid="zoom-in-button" aria-label="Zoom in">+</button>
  <button id="zOut" type="button" data-testid="zoom-out-button" aria-label="Zoom out">-</button>
  <button id="zSite" type="button" data-testid="zoom-site-button" aria-label="Potion tank"><img src="/assets/potion.png" alt=""/></button>
  <button id="zFit" type="button" data-testid="zoom-fit-button" aria-label="Whole map">ALL</button>
</div>
<div id="load" data-testid="game-loading">POTIONRH...</div>
<script type="module">
import * as THREE from "/assets/three.module.min.js";

const X0 = -36, X1 = 132, Z0 = 0, Z1 = 112, W = X1 - X0, H = Z1 - Z0, MX = (X0 + X1) / 2, MZ = (Z0 + Z1) / 2;
const hsh = (a, b, c) => {
  let n = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c || 0, 2246822519);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return (n ^ (n >>> 16)) >>> 0;
};
const rnd = (a, b, c) => (hsh(a, b, c) % 10000) / 10000;

/* ---- sky (original bands + twinkles) ---- */
const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
function drawSky(tick) {
  const bands = ["#a9dbff", "#b3e0ff", "#bde5ff", "#c7eaff", "#d2eefe", "#ddf2fd", "#e8f4fb", "#f4eaf6", "#f8dcee", "#f6c6de"];
  for (let i = 0; i < bands.length; i++) { sctx.fillStyle = bands[i]; sctx.fillRect(0, i * 24, 256, 24); }
  for (let i = 0; i < 40; i++) {
    const r = hsh(i, 5, 1), x = r % 256, y = (r >>> 10) % 240;
    const on = (tick + i * 13) % 90 < 45;
    sctx.fillStyle = on ? "#ffffff" : "#ffd6ea";
    sctx.fillRect(x, y, 1, 1);
    if (on) { sctx.fillRect(x - 1, y, 3, 1); sctx.fillRect(x, y - 1, 1, 3); }
  }
}

/* ---- renderer ---- */
const canvas = document.getElementById("c");
const coarse = matchMedia("(pointer:coarse)").matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 800);
const CAM_DIR = new THREE.Vector3(1, 0.8165, 1).normalize();
const SIN_EL = CAM_DIR.y;
const RIGHT = new THREE.Vector3(1, 0, -1).normalize();
const FWD = new THREE.Vector3(-1, 0, -1).normalize();

scene.add(new THREE.HemisphereLight(0xeaf6ff, 0xf3a6c8, 1.55));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.1);
sun.position.set(MX - 70, 140, MZ + 46);
sun.target.position.set(MX, 0, MZ);
sun.castShadow = true;
sun.shadow.mapSize.set(coarse ? 2048 : 4096, coarse ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -125, right: 125, top: 125, bottom: -125, near: 1, far: 420 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

function noiseTex() {
  const cv = document.createElement("canvas"); cv.width = cv.height = 8;
  const g = cv.getContext("2d");
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const v = 214 + (hsh(x, y, 21) % 42);
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, y, 1, 1);
  }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const NOISE = noiseTex();
const BOX = new THREE.BoxGeometry(1, 1, 1);

/* ---- voxel list ---- */
const B = [];
const tmpC = new THREE.Color();
function box(cx, by, cz, sx, sy, sz, color, jit) {
  tmpC.set(color);
  if (jit) tmpC.multiplyScalar(1 + (rnd(Math.round(cx * 7), Math.round(cz * 7), Math.round(by * 7) + B.length % 5) - 0.5) * jit);
  B.push(cx, by + sy / 2, cz, sx, sy, sz, tmpC.r, tmpC.g, tmpC.b);
}

/* ---- map layout ---- */
const inRect = (x, z, r) => x >= r[0] && x <= r[2] && z >= r[1] && z <= r[3];
const FARMS = [[22, 28, 34, 36], [58, 86, 72, 95], [-28, 52, -16, 60]];
const farmOf = (x, z) => FARMS.find((r) => inRect(x, z, r));
const HOUSES = [[-24, 14], [-20, 30], [8, 66], [26, 70], [112, 34], [120, 90], [90, 98], [30, 100], [-26, 74], [66, 104], [14, 12], [76, 10], [120, 12]];
const LAKES = [[8, 96, 12, 8], [116, 62, 8, 11]];
const MINES = [[66.5, 62.5]];
const SHOP = [46, 26, 51, 30];
const isWater = (x, z) => {
  for (const l of LAKES) { const a = (x + 0.5 - l[0]) / l[2], b = (z + 0.5 - l[1]) / l[3]; if (a * a + b * b < 1) return true; }
  const dx = (x + 0.5 - 62) / 15, dz = (z + 0.5 - 39) / 10;
  if (dx * dx + dz * dz >= 1) return false;
  const ix = x + 0.5 - 67, iz = z + 0.5 - 39;
  return ix * ix + iz * iz > 10;
};
function tile(x, z) {
  if (isWater(x, z)) return "water";
  if (MINES.some((m) => Math.abs(x + 0.5 - m[0]) < 1.5 && Math.abs(z + 0.5 - m[1]) < 1.5)) return "pit";
  if (Math.hypot(x + 0.5 - 80, z + 0.5 - 66) < 6.3) return "cobble";
  if (x >= 44 && x <= 58 && z >= 55 && z <= 69) return "cobble";
  if ((z >= 65 && z <= 67 && x >= 63 && x < 75) || (x >= 79 && x <= 80 && z >= 72 && z < 80) || (x >= 50 && x <= 52 && z >= 70 && z < 80)) return "road";
  if (z < 5) return x >= 22 && x <= 66 ? "cobble" : "dark";
  if (x >= 40 && x <= 42) return "road";
  if (z >= 22 && z <= 24) return "road";
  if ((z >= 44 && z <= 46) || (z >= 80 && z <= 82)) return "road";
  if (z >= 22 && ((x >= -10 && x <= -8) || (x >= 100 && x <= 102))) return "road";
  if (z >= 36 && z <= 37 && x < 20 && x > -8) return "cobble";
  const f = farmOf(x, z);
  if (f) return (z - f[1]) % 3 === 1 && x > f[0] && x < f[2] ? "tilled" : "soil";
  return "grass";
}
const RESERVED = [
  [20, 26, 36, 38], [44, 24, 53, 32], [32, 14, 54, 21], [70, 14, 94, 21], [80, 47, 91, 56],
  [78, 26, 84, 30], [8, 49, 18, 59], [34, 24, 40, 28], [46, 28, 60, 37], [100, 84, 112, 96], [60, 55, 99, 79], [76, 83, 88, 89], [43, 52, 60, 80], [59, 49, 69, 55],
  ...FARMS.map((r) => [r[0] - 2, r[1] - 2, r[2] + 2, r[3] + 2]), ...HOUSES.map(([x, z]) => [x - 2, z - 2, x + 6, z + 7])
];
const reserved = (x, z) => RESERVED.some((r) => inRect(x, z, r));
for (let n = 0; n < 800 && MINES.length < 8; n++) {
  const x = X0 + 8 + hsh(n, 1, 77) % (W - 20), z = 10 + hsh(n, 2, 77) % (H - 18);
  if (MINES.some((m) => Math.hypot(m[0] - x, m[1] - z) < 26)) continue;
  let ok = true;
  for (let a = x - 5; a <= x + 7 && ok; a++) for (let b = z - 5; b <= z + 5; b++) if (tile(a, b) !== "grass" || reserved(a, b)) { ok = false; break; }
  if (ok) { MINES.push([x + 0.5, z + 0.5]); RESERVED.push([x - 5, z - 5, x + 7, z + 5]); }
}
function grassColor(x, z) {
  let c = "#7cc456";
  const n = Math.sin(x * 0.13 + 1) + Math.sin(z * 0.17) + Math.sin((x + z) * 0.07);
  if (n > 1.2) c = "#5aa645"; else if (n < -1.3) c = "#86cc52"; else if (n > 0.5) c = "#6fb84e";
  if (x < 0 || x > 96 || z > 62) return c;
  if (z < 22) c = "#86cc52";
  if (x < 26 && z > 25 && z < 44) c = "#6fb84e";
  if (x > 17 && x < 36 && z > 47) c = "#5aa645";
  if (x > 54 && z > 50) c = "#72bd50";
  if (x > 43 && x < 80 && z > 25 && z < 52) c = "#6fb84e";
  return c;
}

/* ---- ground ---- */
const waterCells = [];
for (let z = Z0; z < Z1; z++) for (let x = X0; x < X1; x++) {
  const t = tile(x, z), cx = x + 0.5, cz = z + 0.5;
  const check = (x + z) % 2 ? 1.03 : 0.97;
  if (t === "water") { waterCells.push(x, z); box(cx, -1.6, cz, 1, 1, 1, "#3c6f9c", 0.08); continue; }
  if (t === "pit") { box(cx, -4.4, cz, 1, 1, 1, "#c2356b", 0.2); continue; }
  let col = "#a8663a", top = 0;
  if (t === "grass") col = grassColor(x, z);
  if (t === "dark") col = "#3f7f3a";
  if (t === "road") { col = "#e0b074"; top = -0.06; }
  if (t === "cobble") { col = (hsh(x, z, 4) % 3) ? "#a9a9b8" : "#8f8fa3"; top = -0.03; }
  if (t === "soil") col = "#9a6a3e";
  if (t === "tilled") { col = "#74492a"; top = -0.1; }
  tmpC.set(col).multiplyScalar(check * (1 + (rnd(x, z, 2) - 0.5) * 0.07));
  B.push(cx, top - 0.5, cz, 1, 1, 1, tmpC.r, tmpC.g, tmpC.b);
}
/* island underside (visible faces) */
for (let x = X0; x < X1; x++) under(x, Z1 - 1);
for (let z = Z0; z < Z1 - 1; z++) under(X1 - 1, z);
function under(x, z) {
  const depth = 3 + (hsh(x, z, 31) % 4) + Math.round(Math.sin((x + z) * 0.21) * 2 + 2);
  for (let d = 1; d <= depth; d++) {
    const col = d > 1 && hsh(x, z, d + 50) % 6 === 0 ? (d % 2 ? "#ec4f86" : "#ff6fa4") : d < 3 ? "#a8663a" : d < 5 ? "#94572f" : (hsh(x, z, d) % 3 ? "#8a7f96" : "#6f6580");
    const inset = d > depth - 2 ? 0.25 * (d - depth + 2) : 0;
    box(x + 0.5 - (x === X1 - 1 ? inset : 0), -1 - d, z + 0.5 - (z === Z1 - 1 ? inset : 0), 1, 1, 1, col, 0.1);
  }
}

/* ---- props ---- */
const treeAt = new Set();
function tree(x, z, kind, big) {
  const cx = x + 0.5, cz = z + 0.5, s = big ? 1.25 : 1;
  const pal = {
    green: ["#4f9a3e", "#6fb84e", "#94d866"], deep: ["#2f6b33", "#3d8240", "#4f9a3e"],
    orange: ["#d4651c", "#ff9a3c", "#ffbe78"], yellow: ["#e3a62a", "#ffd34d", "#ffe27a"], pink: ["#ec4f86", "#f08cae", "#ffc8da"]
  }[kind];
  box(cx, 0, cz, 0.42 * s, 1.3 * s, 0.42 * s, "#8e4a26", 0.1);
  box(cx, 1.0 * s, cz, 1.7 * s, 1.0 * s, 1.7 * s, pal[0], 0.08);
  box(cx, 1.9 * s, cz, 1.25 * s, 0.75 * s, 1.25 * s, pal[1], 0.08);
  box(cx, 2.6 * s, cz, 0.7 * s, 0.45 * s, 0.7 * s, pal[2], 0.06);
  treeAt.add(x + "," + z);
}
const nearTree = (x, z) => { for (let a = -2; a <= 2; a++) for (let b = -2; b <= 2; b++) if (treeAt.has((x + a) + "," + (z + b))) return true; return false; };
for (let z = Z0; z < Z1; z++) for (let x = X0; x < X1; x++) {
  const t = tile(x, z);
  if (t === "dark") { if (x % 2 === 0 && z % 2 === 0 && z < 4) tree(x, z, "deep", hsh(x, z, 3) % 2 === 0); continue; }
  if (t !== "grass" || reserved(x, z) || z < 7) continue;
  const r = hsh(x, z, 17) % 1000;
  const wood = Math.sin(x * 0.09) + Math.cos(z * 0.11 + x * 0.05);
  const dens = (x < 22 && x >= 0 && z < 64) || wood > 1.05 ? 55 : z < 22 ? 16 : 22;
  if (r < dens && !nearTree(x, z)) {
    const k = hsh(x, z, 9) % 20;
    tree(x, z, z > 46 && k < 5 ? (k < 2 ? "orange" : k < 4 ? "yellow" : "pink") : k === 19 ? "pink" : "green", hsh(x, z, 5) % 4 === 0);
  } else if (r > 965) {
    const fc = ["#ff9ec6", "#fff2fa", "#ffe27a", "#ec4f86"][hsh(x, z, 6) % 4];
    const ox = x + 0.3 + rnd(x, z, 1) * 0.4, oz = z + 0.3 + rnd(x, z, 2) * 0.4;
    box(ox, 0, oz, 0.08, 0.28, 0.08, "#4f9a3e");
    box(ox, 0.28, oz, 0.26, 0.16, 0.26, fc);
  } else if (r > 958) box(x + 0.5, 0, z + 0.5, 0.6, 0.35, 0.5, "#a9a9b8", 0.12);
  else if (r > 930) box(x + 0.2 + rnd(x, z, 3) * 0.6, 0, z + 0.2 + rnd(x, z, 4) * 0.6, 0.12, 0.22, 0.12, "#94d866");
}

/* stone wall */
for (let x = X0; x < X1; x++) {
  if (x >= 40 && x <= 42) continue;
  box(x + 0.5, 0, 5.5, 1, 1.2, 0.8, x % 2 ? "#8f8fa3" : "#a9a9b8", 0.08);
  if (x % 2 === 0) box(x + 0.5, 1.2, 5.5, 0.8, 0.4, 0.8, "#b9b9c8", 0.06);
}
for (const gx of [39.5, 43.5]) { box(gx, 0, 5.5, 1.1, 2.6, 1.1, "#8f8fa3", 0.06); box(gx, 2.6, 5.5, 1.3, 0.3, 1.3, "#f3a6c8"); }

/* lamps & signs */
function lamp(x, z) { box(x, 0, z, 0.18, 1.9, 0.18, "#5c2c12"); box(x, 1.9, z, 0.5, 0.5, 0.5, "#ffe27a"); box(x, 2.4, z, 0.62, 0.12, 0.62, "#3a2340"); }
function sign(x, z) { box(x, 0, z, 0.16, 1.1, 0.16, "#8e4a26"); box(x, 0.8, z + 0.06, 0.9, 0.55, 0.14, "#c48a58"); box(x, 0.98, z + 0.14, 0.6, 0.08, 0.04, "#7a4424"); }
for (let lx = X0 + 4; lx < X1 - 2; lx += 8) if (lx < 37 || lx > 45) lamp(lx + 0.5, 7.2);
for (const lz of [30, 52, 66, 76, 90, 104]) { lamp(39.4, lz); lamp(-10.6, lz); lamp(102.6, lz); }
for (const [sx, sz] of [[38.6, 21], [44, 26], [58, 20.6], [67, 21], [38.6, 47.6], [44, 43], [76, 23.5], [20.5, 21]]) sign(sx, sz);

/* farms */
const dynCrops = [];
for (const FARM of FARMS) {
for (let x = FARM[0]; x <= FARM[2]; x++) for (const z of [FARM[1], FARM[3]]) {
  if (z === FARM[3] && x >= FARM[0] + 5 && x <= FARM[0] + 6) continue;
  box(x + 0.5, 0.35, z + 0.5, 1, 0.12, 0.12, "#8e4a26", 0.1); box(x + 0.5, 0.7, z + 0.5, 1, 0.12, 0.12, "#8e4a26", 0.1);
  if (x % 2 === 0) box(x + 0.5, 0, z + 0.5, 0.2, 1, 0.2, "#5c2c12");
}
for (let z = FARM[1]; z <= FARM[3]; z++) for (const x of [FARM[0], FARM[2]]) {
  box(x + 0.5, 0.35, z + 0.5, 0.12, 0.12, 1, "#8e4a26", 0.1); box(x + 0.5, 0.7, z + 0.5, 0.12, 0.12, 1, "#8e4a26", 0.1);
  if (z % 2 === 0) box(x + 0.5, 0, z + 0.5, 0.2, 1, 0.2, "#5c2c12");
}
for (let z = FARM[1]; z <= FARM[3]; z++) for (let x = FARM[0] + 1; x < FARM[2]; x++) {
  if (tile(x, z) !== "tilled") continue;
  if (FARM === FARMS[1]) { dynCrops.push(x, z); continue; }
  const k = hsh(x, z, 8) % 5, cx = x + 0.5, cz = z + 0.5;
  box(cx, -0.1, cz, 0.3, 0.3 + k * 0.08, 0.3, "#4f9a3e", 0.1);
  if (k > 1) box(cx, 0.2 + k * 0.08, cz, 0.42, 0.26, 0.42, ["#94d866", "#94d866", "#ff9a3c", "#ec4f86", "#ffe27a"][k]);
}
}

/* market stalls */
function stall(x, z, a, b, goods) {
  for (const [px, pz] of [[-1.3, -0.8], [1.3, -0.8], [-1.3, 0.8], [1.3, 0.8]]) box(x + px, 0, z + pz, 0.18, 2.1, 0.18, "#5c2c12");

  if (keys.has("KeyS") || keys.has("ArrowDown")) pan(0, -k * innerHeight / S);
  if (keys.has("Equal") || keys.has("NumpadAdd")) zoomBy(0.97);
  if (keys.has("Minus") || keys.has("NumpadSubtract")) zoomBy(1.03);
  zoomStep(); applyCam();
  if (tick % 8 === 0) { paintWater(Math.floor(tick / 8)); drawSky(tick); }
  if (tick % 2 === 0) paintPortal(tick / 2);
  for (const a of actors) {
    const b = Math.sin(t * 2 + a.ph);
    a.up.scale.y = 1 + b * 0.025;
    a.head.rotation.y = Math.sin(t * 0.5 + a.ph) * 0.35;
  }
  if (dino) {
    dino.position.set(35 + Math.sin(t * 0.4) * 0.5, 2.6 + Math.sin(t * 2.2) * 0.25, 27.6 + Math.cos(t * 0.4) * 0.4);
    for (const [p, s] of wings) p.rotation.z = s * Math.sin(t * 9) * 0.6;
  }
  updateSite(dt, t);
  if (potionSign) { potionSign.position.y = 7.4 + Math.sin(t * 1.6) * 0.25; potionSign.material.rotation = Math.sin(t * 1.2) * 0.08; }
  for (const c of clouds) { c.position.x -= c.userData.v * dt; if (c.position.x < X0 - 50) c.position.x = X1 + 50; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize(); S = goalS = Math.min(fitS, 58); target.set(67, 0, 67); applyCam(); paintWater(0); drawSky(0);
const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load("20px 'Press Start 2P'"), new Promise((r) => setTimeout(r, 2500))]) : Promise.resolve();
fontReady.catch(() => {}).then(() => {
  buildActors();
  buildSite();
  renderer.shadowMap.needsUpdate = true;
  document.getElementById("load").classList.add("off");
  setTimeout(hideHint, 9000);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
